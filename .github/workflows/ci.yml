name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Run unit tests
        run: make test

      - name: Build universal package
        run: SKIP_LOCAL_INSTALL=1 bash Scripts/release.sh
