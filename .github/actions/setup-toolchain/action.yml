name: Set up LocalClip toolchain
description: Use the same pinned Xcode and Swift toolchain for CI and release builds.

runs:
  using: composite
  steps:
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "16.4"

    - name: Print toolchain versions
      shell: bash
      run: |
        swift --version
        xcodebuild -version
